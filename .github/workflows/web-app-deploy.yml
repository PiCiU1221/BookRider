name: Deploy Frontend

on:
  pull_request:
    branches:
      - dev
    types:
      - closed
    paths:
      - "web_app/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web_app/package-lock.json

      - name: Generate environment variables
        run: echo "VITE_API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: web_app/dist/
          retention-days: 1

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event.pull_request.merged == true

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: webapp-dist
          path: dist

      - name: Transfer artifacts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "dist/"
          target: "/tmp/webapp"
          strip_components: 1

      - name: Update webroot and reload NGINX
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /var/www/myreactapp
            sudo rsync -a --delete /tmp/webapp/ /var/www/myreactapp/
            sudo chown -R www-data:www-data /var/www/myreactapp
            sudo rm -rf /tmp/webapp
            sudo systemctl reload nginx
